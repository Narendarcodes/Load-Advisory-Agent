      implementation: PREPROCESS_THEN_ZEN

    - id: PL-041
      name: Recent 30+ DPD
      inputs: [dpd_history, assessment_window]
      check: Identify recent 30 or more days past due
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-042
      name: Recent 60+ DPD
