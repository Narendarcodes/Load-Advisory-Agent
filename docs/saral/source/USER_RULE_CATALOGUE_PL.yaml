      check: Calculate income remaining after obligations
      implementation: ZEN_DIRECT

    - id: PL-066
      name: Loan affordability
      inputs: [monthly_net_income, existing_obligations, proposed_emi]
      check: Determine whether requested loan is affordable
      implementation: ZEN_DIRECT

    - id: PL-067
      name: Maximum affordable EMI
      inputs: [monthly_net_income, existing_obligations, approved_maximum_foir]
      check: Calculate maximum permitted EMI under approved methodology
      implementation: ZEN_DIRECT

    - id: PL-068
      name: Loan amount affordability
      inputs: [maximum_affordable_emi, interest_rate, tenure_months, eligible_amount]
      check: Calculate maximum affordable loan amount
      implementation: PREPROCESS_THEN_ZEN

  H_LOAN_REQUEST_AND_PRODUCT_PARAMETERS:
    - id: PL-069
      name: Minimum loan amount
      inputs: [requested_amount, minimum_loan_amount]
      check: Requested amount meets minimum
      implementation: ZEN_DIRECT

    - id: PL-070
      name: Maximum loan amount
      inputs: [requested_amount, maximum_loan_amount]
      check: Requested amount is within product limit
      implementation: ZEN_DIRECT

    - id: PL-071
      name: Minimum tenure
      inputs: [tenure_months, minimum_tenure_months]
      check: Requested tenure meets minimum
      implementation: ZEN_DIRECT

    - id: PL-072
      name: Maximum tenure
      inputs: [tenure_months, maximum_tenure_months]
      check: Requested tenure does not exceed maximum
      implementation: ZEN_DIRECT

    - id: PL-073
      name: Age-tenure compatibility
      inputs: [age_at_maturity, maximum_age_at_maturity]
      check: Validate age at loan maturity
      implementation: ZEN_DIRECT

    - id: PL-074
      name: EMI calculation validation
      inputs: [principal, interest_rate, tenure_months, calculated_emi, independently_calculated_emi]
      check: Verify EMI calculation
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-075
      name: Interest rate eligibility
      inputs: [approved_interest_rate_range, applicant_pricing_band]
      check: Apply approved pricing rules
      implementation: ZEN_DIRECT

    - id: PL-076
      name: Loan purpose restrictions
      inputs: [loan_purpose, eligible_loan_purposes]
      check: Validate loan purpose
      implementation: ZEN_DIRECT

    - id: PL-077
      name: Existing exposure
      inputs: [total_existing_exposure, approved_exposure_limit]
      check: Evaluate existing exposure against approved limit
      implementation: ZEN_DIRECT

  I_BANK_STATEMENT_AND_CASH_FLOW:
    - id: PL-078
      name: Salary credit consistency
      inputs: [bank_transactions, salary_credit_consistency]
      check: Identify regular salary credits
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-079
      name: Average monthly balance
      inputs: [bank_transactions, average_monthly_balance]
      check: Calculate average bank balance
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-080
