    - id: PL-049
      name: Suit-filed accounts
      inputs: [bureau_accounts, suit_filed_status]
      check: Identify suit-filed or reported default indicators
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-050
      name: Restructured accounts
      inputs: [bureau_accounts, restructured_account_count]
      check: Identify restructured loans
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-051
      name: Credit card repayment behaviour
      inputs: [credit_card_payment_history, missed_payment_count]
      check: Evaluate credit card repayment patterns
      implementation: PREPROCESS_THEN_ZEN

  F_CREDIT_ENQUIRIES_AND_RECENT_BORROWING:
    - id: PL-052
      name: Recent hard enquiries
      inputs: [bureau_enquiries, enquiries_last_30_days]
      check: Count recent hard enquiries
