      inputs: [bank_transactions, monthly_income_variance]
      check: Measure variation in incoming credits
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-085
      name: Unusual transaction patterns
      inputs: [bank_transactions, anomaly_indicators]
      check: Identify transactions requiring review
      implementation: EXTERNAL_CHECK

    - id: PL-086
      name: Undeclared debt
      inputs: [declared_obligations, observed_recurring_debits, debt_mismatch]
      check: Identify possible undeclared obligations
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-087
      name: Salary credit reversal
      inputs: [bank_transactions, salary_reversal_indicator]
      check: Identify reversed salary credits
      implementation: PREPROCESS_THEN_ZEN

  J_DOCUMENT_AND_FRAUD_CONTROLS:
    - id: PL-088
      name: Document completeness
      inputs: [submitted_documents, required_documents]
      check: Verify required documents are present
      implementation: ZEN_DIRECT

    - id: PL-089
      name: OCR confidence
      inputs: [ocr_field_confidence, minimum_confidence]
      check: Evaluate extracted field confidence
      implementation: ZEN_DIRECT

    - id: PL-090
      name: Document tampering indicators
      inputs: [document_integrity_result, tampering_flags]
      check: Evaluate document integrity signals
      implementation: EXTERNAL_CHECK

    - id: PL-091
      name: Duplicate document
      inputs: [document_hash, duplicate_document_result]
      check: Identify duplicate submitted documents
      implementation: EXTERNAL_CHECK

    - id: PL-092
      name: Income mismatch
      inputs: [declared_income, ocr_extracted_income, verified_income]
      check: Compare declared and extracted income
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-093
      name: Bank statement integrity
      inputs: [statement_integrity_result, statement_validation_flags]
      check: Evaluate statement validation result
      implementation: EXTERNAL_CHECK

    - id: PL-094
      name: Identity evidence consistency
      inputs: [identity_fields, extracted_identity_fields, identity_match_status]
      check: Compare identity evidence
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-095
      name: Consent validation
      inputs: [required_consents, recorded_consents]
      check: Ensure required consents are recorded
      implementation: ZEN_DIRECT

    - id: PL-096
      name: Missing evidence
      inputs: [required_fields, supplied_fields]
      check: Identify missing underwriting inputs
      implementation: ZEN_DIRECT

    - id: PL-097
      name: Conflicting evidence
      inputs: [evidence_comparison_results, conflict_flags]
      check: Detect conflicting evidence across sources
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-098
      name: Manual review routing
      inputs: [review_flags, unresolved_conflicts, fraud_indicators]
      check: Route unresolved cases for human review
      implementation: ZEN_DIRECT

    - id: PL-099
      name: Decision trace completeness
      inputs: [rule_results, evidence_references, policy_version]
      check: Ensure decision has a complete audit trace
      implementation: ZEN_DIRECT

decision_aggregation:
  precedence:
    - DECLINE: An approved hard-decline rule has failed.
    - MANUAL_REVIEW: Material risk signal or unresolved evidence conflict.
    - MORE_INFORMATION_REQUIRED: Essential inputs are missing.
    - ELIGIBILITY_CONDITIONS_MET: All applicable checks pass.

  constraints:
    - Risk indicators must not automatically become hard declines.
    - Missing inputs must not be treated as failed inputs.
    - Hard-decline rules require explicit policy approval.
    - Manual review must override automatic positive outcomes.
    - Every outcome must include rule IDs and explanations.
    - Eligibility conditions met does not mean loan sanctioned.

policy_governance:
  required_rule_metadata:
    - rule_id
    - rule_name
    - rule_group
    - implementation_type
    - input_schema
    - condition
    - outcome
    - severity
    - policy_source
    - policy_version
    - approval_status
    - effective_from
    - effective_to
    - test_cases

  approval_status_values:
    - APPROVED_BAJAJ_SOURCE
    - APPROVED_REGULATORY
    - PROTOTYPE_SYNTHETIC
    - PENDING_BUSINESS_APPROVAL
    - DEPRECATED

  final_instruction:
    - Implement only approved rules in production decision paths.
    - Keep synthetic rules in a separate test profile.
    - Do not use invented thresholds as Bajaj policy.
    - Keep evidence acquisition and document processing outside ZEN.
    - Use ZEN for deterministic evaluation and decision aggregation.
