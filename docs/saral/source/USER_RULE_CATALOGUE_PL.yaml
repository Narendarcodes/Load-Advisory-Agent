
project:
  name: Personal Loan Underwriting Rule Catalogue
  product: Personal Loan
  lender_policy_source: Bajaj Finance
  decision_engine: ZEN Engine
  purpose: Student prototype and advisory decision evaluation
  policy_constraints:
    - Do not invent Bajaj Finance underwriting thresholds.
    - Separate published lender criteria from synthetic prototype rules.
    - Every rule must have a source, version, and approval status.
    - Missing data must not automatically mean rejection.
    - ZEN evaluates structured data; it does not fetch bureau reports or perform OCR.
    - A ZEN outcome is not an actual lender sanction.

outcomes:
  - PASS
  - FAIL
  - REVIEW
  - INSUFFICIENT_DATA

implementation_types:
  ZEN_DIRECT: Deterministic condition, comparison, calculation, or decision aggregation.
  PREPROCESS_THEN_ZEN: Calculate or normalize the input outside ZEN, then evaluate it in ZEN.
  EXTERNAL_CHECK: Obtain or verify evidence externally, then pass the result to ZEN.

rule_groups:

  A_APPLICANT_ELIGIBILITY:
    - id: PL-001
      name: Applicant minimum age
      inputs: [date_of_birth, assessment_date, minimum_age]
      check: Applicant meets minimum age
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-002
      name: Maximum age at maturity
      inputs: [date_of_birth, assessment_date, loan_tenure_months, maximum_age_at_maturity]
      check: Age at end of tenure is within product limit
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-003
      name: Nationality eligibility
      inputs: [nationality, eligible_nationalities]
      check: Applicant satisfies approved nationality criteria
      implementation: ZEN_DIRECT

    - id: PL-004
      name: Applicant profile
      inputs: [employment_type, supported_employment_types]
      check: Salaried or self-employed profile is supported
      implementation: ZEN_DIRECT

    - id: PL-005
      name: Employment category
      inputs: [employment_category, eligible_employment_categories]
      check: Employment category is eligible
      implementation: ZEN_DIRECT

    - id: PL-006
      name: Identity completeness
      inputs: [identity_verification_status, required_identity_fields]
      check: Required identity information is available
      implementation: ZEN_DIRECT

    - id: PL-007
      name: Duplicate applicant
      inputs: [applicant_identifier, duplicate_match_result]
      check: Detect duplicate applicant or application
      implementation: EXTERNAL_CHECK

  B_INCOME_AND_EMPLOYMENT:
    - id: PL-008
      name: Minimum monthly income
      inputs: [monthly_net_income, minimum_income, applicant_city]
      check: Income meets applicable location-specific threshold
      implementation: ZEN_DIRECT

    - id: PL-009
      name: Net monthly income
      inputs: [gross_income, deductions, monthly_net_income]
      check: Use verified take-home income
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-010
      name: Average monthly income
      inputs: [monthly_income_history, assessment_period]
      check: Calculate average income across assessment period
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-011
      name: Income consistency
      inputs: [monthly_income_history, income_variation]
      check: Detect significant income fluctuations
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-012
      name: Salary credit verification
      inputs: [declared_salary, observed_salary_credits, salary_match_status]
      check: Compare declared income with bank salary credits
      implementation: EXTERNAL_CHECK

    - id: PL-013
      name: Employer stability
      inputs: [employer_history, employer_stability_indicator]
      check: Assess employer continuity
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-014
      name: Employment duration
      inputs: [employment_start_date, assessment_date, employment_months]
      check: Minimum employment duration
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-015
      name: Employment gaps
      inputs: [employment_history, employment_gap_months]
      check: Detect recent employment gaps
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-016
      name: Employment type
      inputs: [employment_type, employment_status]
      check: Evaluate permanent, contractual, probationary or other status
      implementation: ZEN_DIRECT

    - id: PL-017
      name: Income source consistency
      inputs: [declared_income, verified_income, income_match_status]
      check: Compare declared and supporting evidence
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-018
      name: Recent income reduction
      inputs: [historical_income, recent_income, income_reduction_percentage]
      check: Detect material income decline
      implementation: PREPROCESS_THEN_ZEN

  C_BUREAU_IDENTITY_AND_DATA_QUALITY:
    - id: PL-019
      name: Bureau report availability
      inputs: [bureau_report_status]
      check: Determine whether bureau report exists
      implementation: EXTERNAL_CHECK

    - id: PL-020
