      inputs: [bank_transactions, expected_emi_debits, actual_emi_debits]
      check: Compare expected and observed EMI debits
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-083
      name: Cash deposit concentration
      inputs: [bank_transactions, cash_deposit_percentage]
      check: Identify unusual dependence on cash deposits
      implementation: PREPROCESS_THEN_ZEN

    - id: PL-084
