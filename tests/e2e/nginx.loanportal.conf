# Throw-away front door for the browser harness (Phase 9).
#
# The shipped frontend container hard-codes `server_name p1loan.local` and
# `X-Frappe-Site-Name p1loan.local`, so it can never serve the disposable site.
# This proxy answers on 127.0.0.1:8081 and pins every request to
# `loanportal.local`: it is impossible for one of these journeys to reach the
# shared site even if the browser sends a different Host header.
#
#   docker run --rm --name loanportal-e2e-proxy \
#     --network frappe_docker_default -p 127.0.0.1:8081:8080 \
#     --add-host host.docker.internal:host-gateway \
#     -v "$PWD/tests/e2e/nginx.loanportal.conf:/etc/nginx/conf.d/default.conf:ro" \
#     nginx:alpine
#
# `/api/copilotkit` goes to the CopilotKit runtime on the host; everything else
# goes to the site's own dev server, which resolves symlinked assets inside the
# Frappe container.

upstream frappe_backend {
	server backend:8001 fail_timeout=0;
}

server {
	listen 8080;
	server_name _;
	absolute_redirect off;

	client_max_body_size 50m;

	location /api/copilotkit {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass http://host.docker.internal:4200;
		proxy_read_timeout 180;
		proxy_buffering off;
	}

	location / {
		proxy_http_version 1.1;
		# Pinned on purpose: Host and site name never come from the client.
		proxy_set_header Host loanportal.local;
		proxy_set_header X-Frappe-Site-Name loanportal.local;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 180;
		proxy_redirect off;
		proxy_pass http://frappe_backend;
	}
}
