[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "loan_advisory_portal"
authors = [{ name = "Loan Rangers", email = "dev@example.invalid" }]
readme = "README.md"
dynamic = ["version"]
description = "Borrower portal for the Loan Advisory Agent, built on Frappe and Frappe Lending"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Frappe",
]
dependencies = [
    "Pillow>=10.1",
    "pypdfium2>=4.30",
    "numpy>=1.26",  # deskew before OCR (ocr/preprocess.py)
]

[project.optional-dependencies]
# Default OCR engine (PaddleOCR PP-OCRv5 mobile). Without it, Tesseract is used automatically.
# Install the CPU wheel from Paddle's index; see requirements-ocr-paddle.txt.
paddle = [
    "paddlepaddle==3.2.0",
    "paddleocr==3.7.0",
]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
