# Policy source register v2 (lender-profile aware). Metadata only: fetched raw text lives on the droplet
# ($LOAN_POLICY_DIR, default /root/hx/loan/policy) and is NOT in git. Every item records authority, version and
# approval state; nothing becomes "approved" automatically - a fetched change is a REVIEW EVENT.
#
# approval_status: approved (reviewed, current) | approved_historical (kept for audit / past decisions, excluded
#   from current-policy answers) | pending_review | registered_not_ingested
# source_type: regulator | regulator_faq | lender_policy | lender_terms | lender_web_page | lender_education |
#   synthetic | untrusted_test | statute
# lender_id: null for regulator text; BFL = Bajaj Finance Ltd, the PUBLIC REFERENCE LENDER (not a partner);
#   HDFC/ICICI = public comparison lenders (not partners); SYNTHETIC = team prototype policy.
# applies_to_entity: [bank] | [nbfc] | [all] - which RBI entity type a regulator text governs. Lender profiles
#   (config/lender_profiles/*.yaml) select documents by entity type + lender_id, so the design stays lender-neutral.
# local_file: official PDF downloaded through a browser (rbidocs.rbi.org.in serves a bot challenge to scripts);
#   source_url is still the official URL; raw sha256 is in data/sources/policy_manifest_v2.json.
