name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-rag.txt

      - name: Install dependencies
        # The GPU-only RAG extras (transformers, sentence-transformers in
        # requirements-rag.txt) are deliberately omitted: they pull torch, and
        # the retrieval code imports sentence-transformers lazily. requirements-test.txt is
        # installed explicitly because the suite imports rag/ helpers whose dependencies are not
        # in the application manifest; an inline `pip install` of four packages used to do this by
        # accident, which left local runs failing to collect three test modules.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest tests/ -q
