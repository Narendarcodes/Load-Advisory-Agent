# Droplet variant of loanrangers.yml (UTF-8, LF). Same images/services as P1.
# Differences: frontend bound to 127.0.0.1 only, DB root password from env (never committed),
# custom image never pulled, separate project/volume names (loanhx_*).
# Usage: DB_ROOT_PASSWORD=... docker compose -f loanrangers.droplet.yml up -d
name: loanhx
services:
  backend:
    depends_on:
      configurator:
        condition: service_completed_successfully
        required: true
    environment:
      GUNICORN_THREADS: '4'
      GUNICORN_TIMEOUT: '120'
      GUNICORN_WORKERS: '2'
    image: loanrangers-frappe:16
    networks:
      default: null
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    volumes:
    - type: volume
      source: sites
      target: /home/frappe/frappe-bench/sites
      volume: {}
  configurator:
    command:
    - 'ls -1 apps > sites/apps.txt; bench set-config -g db_host $$DB_HOST; bench set-config
      -gp db_port $$DB_PORT; bench set-config -g redis_cache "redis://$$REDIS_CACHE";
      bench set-config -g redis_queue "redis://$$REDIS_QUEUE"; bench set-config -g
      redis_socketio "redis://$$REDIS_QUEUE"; bench set-config -gp socketio_port $$SOCKETIO_PORT;
      bench set-config -g chromium_path /usr/bin/chromium-headless-shell;

      '
    depends_on:
      db:
        condition: service_healthy
        required: true
      redis-cache:
        condition: service_started
        required: true
      redis-queue:
        condition: service_started
        required: true
    entrypoint:
    - bash
    - -c
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: '9000'
    image: loanrangers-frappe:16
    networks:
      default: null
    platform: linux/amd64
    pull_policy: never
    restart: on-failure
    volumes:
    - type: volume
      source: sites
      target: /home/frappe/frappe-bench/sites
      volume: {}
  db:
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    - --skip-character-set-client-handshake
    environment:
      MARIADB_AUTO_UPGRADE: '1'
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      timeout: 5s
      interval: 5s
      retries: 5
      start_period: 5s
    image: mariadb:11.8
    networks:
      default: null
    restart: unless-stopped
    volumes:
    - type: volume
      source: db-data
      target: /var/lib/mysql
      volume: {}
  frontend:
    command:
    - nginx-entrypoint.sh
    depends_on:
      backend:
        condition: service_started
        required: true
      websocket:
        condition: service_started
        required: true
    environment:
      BACKEND: backend:8000
      CLIENT_MAX_BODY_SIZE: 50m
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE:-loanhx.local}
      NGINX_LISTEN_PORT: '8080'
      PROXY_READ_TIMEOUT: '120'
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: 'off'
    image: loanrangers-frappe:16
    networks:
      default: null
    platform: linux/amd64
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 8080
      published: ${FRAPPE_HOST_PORT:-8080}
      protocol: tcp
    pull_policy: never
    restart: unless-stopped
    volumes:
    - type: volume
      source: sites
      target: /home/frappe/frappe-bench/sites
      volume: {}
  queue-long:
    command:
    - bench
    - worker
    - --queue
    - long,default,short
    depends_on:
      configurator:
        condition: service_completed_successfully
        required: true
    image: loanrangers-frappe:16
    networks:
      default: null
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    volumes:
    - type: volume
      source: sites
      target: /home/frappe/frappe-bench/sites
      volume: {}
  queue-short:
    command:
    - bench
    - worker
    - --queue
    - short,default
    depends_on:
      configurator:
        condition: service_completed_successfully
        required: true
    image: loanrangers-frappe:16
    networks:
      default: null
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    volumes:
    - type: volume
      source: sites
      target: /home/frappe/frappe-bench/sites
      volume: {}
  redis-cache:
    image: redis:8.6-alpine
    networks:
      default: null
    restart: unless-stopped
  redis-queue:
    image: redis:8.6-alpine
    networks:
      default: null
    restart: unless-stopped
    volumes:
    - type: volume
      source: redis-queue-data
      target: /data
      volume: {}
  scheduler:
    command:
    - bench
    - schedule
    depends_on:
      configurator:
        condition: service_completed_successfully
        required: true
    image: loanrangers-frappe:16
    networks:
      default: null
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    volumes:
    - type: volume
      source: sites
      target: /home/frappe/frappe-bench/sites
      volume: {}
  websocket:
    command:
    - node
    - /home/frappe/frappe-bench/apps/frappe/socketio.js
    depends_on:
      configurator:
        condition: service_completed_successfully
        required: true
    image: loanrangers-frappe:16
    networks:
      default: null
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    volumes:
    - type: volume
      source: sites
      target: /home/frappe/frappe-bench/sites
      volume: {}
networks:
  default:
    name: loanhx_default
volumes:
  db-data:
    name: loanhx_db-data
  redis-queue-data:
    name: loanhx_redis-queue-data
  sites:
    name: loanhx_sites
